spring.application.name=fsapp
server.port=${PORT:8080}
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=15s
server.forward-headers-strategy=none
server.tomcat.max-connections=1200
server.tomcat.threads.max=100
server.tomcat.connection-timeout=10s
server.tomcat.max-http-form-post-size=1KB
server.max-http-request-header-size=8KB
spring.servlet.multipart.enabled=false
server.error.include-message=never
server.error.include-stacktrace=never
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
spring.web.resources.cache.cachecontrol.no-cache=true
fsapp.public-origin=${FSAPP_PUBLIC_ORIGIN:}
fsapp.allowed-origins=${FSAPP_ALLOWED_ORIGINS:}
fsapp.max-rooms=${FSAPP_MAX_ROOMS:500}
fsapp.max-connections=${FSAPP_MAX_CONNECTIONS:1000}
fsapp.create-per-minute=${FSAPP_CREATE_PER_MINUTE:20}
fsapp.request-per-minute=${FSAPP_REQUEST_PER_MINUTE:120}
fsapp.pairing-attempts-per-minute=${FSAPP_PAIRING_ATTEMPTS_PER_MINUTE:5}
fsapp.pairing-global-attempts-per-minute=${FSAPP_PAIRING_GLOBAL_ATTEMPTS_PER_MINUTE:60}
fsapp.invitation-ttl=10m
fsapp.session-ttl=2h
fsapp.auth-timeout=10s
fsapp.turn-enabled=${FSAPP_TURN_ENABLED:false}
fsapp.turn-key-id=${FSAPP_TURN_KEY_ID:}
fsapp.turn-api-token=${FSAPP_TURN_API_TOKEN:}
fsapp.turn-ttl=${FSAPP_TURN_TTL:2h}
logging.level.org.springframework.web.socket=WARN
