name: Web application
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: backend/pom.xml
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npm run lint && npm run typecheck && npm test
        working-directory: web
      - run: ./scripts/package.sh
      - name: Export resolved Java dependency inventory
        run: ./mvnw -B -ntp org.cyclonedx:cyclonedx-maven-plugin:2.9.1:makeAggregateBom -DincludeTestScope=true
        working-directory: backend
      - uses: actions/upload-artifact@v4
        with:
          name: java-dependencies
          path: backend/target/bom.json
          retention-days: 7
      - run: npx playwright install --with-deps chromium firefox webkit
        working-directory: web
      - run: npm run test:e2e
        working-directory: web
      - run: npm audit --audit-level=high
        working-directory: web
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-results
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
  dependency-scan:
    needs: verify
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@v2.6.0
    with:
      download-artifact: java-dependencies
      scan-args: |-
        --lockfile=./bom.json
        --lockfile=./web/package-lock.json
      upload-sarif: false
    permissions:
      contents: read
      actions: read
      # The reusable OSV workflow declares this even when SARIF upload is off.
      security-events: write
