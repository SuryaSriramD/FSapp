<svg xmlns="http://www.w3.org/2000/svg" width="1184" height="380" viewBox="0 0 1184 380" role="img" aria-labelledby="title description">
  <title id="title">FSApp — Your files. Six digits away.</title>
  <desc id="description">Browser-to-browser file sharing with six-digit pairing and sender approval. An illustration connects a computer and phone beside the example pairing code 012 345.</desc>
