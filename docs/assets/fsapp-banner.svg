      <stop offset="0" stop-color="#346f5f"/>
      <stop offset="1" stop-color="#1c463d"/>
    </linearGradient>
    <clipPath id="canvas-clip"><rect width="1184" height="380" rx="28"/></clipPath>
  </defs>
